services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lstm-api
    environment:
      MODEL_PATH: /opt/lstm-api/models/lstm_final.keras
      SCALER_PATH: /opt/lstm-api/artifacts/ret_scaler.pkl
      META_PATH: /opt/lstm-api/artifacts/inference_meta.pkl
      RESOURCE_SAMPLE_SECONDS: "5"
      TF_CPP_MIN_LOG_LEVEL: "2"
      TF_NUM_INTRAOP_THREADS: "${TF_NUM_INTRAOP_THREADS:-2}"
      TF_NUM_INTEROP_THREADS: "${TF_NUM_INTEROP_THREADS:-1}"
    volumes:
      - ./models:/opt/lstm-api/models:ro
      - ./artifacts:/opt/lstm-api/artifacts:ro
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=4)"
        ]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    networks:
      - observability

  prometheus:
    image: prom/prometheus:latest
    container_name: lstm-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - observability

  grafana:
    image: grafana/grafana:latest
    container_name: lstm-grafana
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - observability

networks:
  observability:

volumes:
  prometheus_data:
  grafana_data:
